[package]
name = "gnosis"
version = "0.1.0"
edition = "2021"
description = "Production graph/vector engine for the Auspicion Suite (document store, knowledge graph, fact/citation, consistency, RAG/agent-memory retrieval)"
license = "AGPL-3.0"

[dependencies]
# serde for the store/graph serialization + the IPC transport
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# tokio async runtime for the query/stream/engine-status API + the embedding provider calls
tokio = { version = "1", features = ["full"] }
# sha2 for the content-hash / node-source SHA-256 discipline
sha2 = "0.10"
# reqwest for the embedding/LLM provider (Ollama) HTTP calls
reqwest = { version = "0.12", features = ["json", "stream"] }
# futures for the SSE stream surface
futures = "0.3"
# §7.2 P2 — the axum server framework for the `gnosis-server` transport host
# (scoped to the bin; the engine lib stays at zero new runtime deps).
axum = "0.7"

[dev-dependencies]
# tokio test support
tokio = { version = "1", features = ["full", "test-util"] }
# mocking the embedding provider HTTP layer in tests (no live remote call in CI)
wiremock = "0.6"

[[bin]]
name = "gnosis"
path = "src/main.rs"

# §7.8 F6 — the RAG-evaluation harness `[[bin]]` (a second bin alongside
# `gnosis`; no new deps). RED-stage stub.
[[bin]]
name = "gnosis-eval"
path = "src/bin/gnosis_eval.rs"

# §7.2 P2 — the `gnosis-server` transport host `[[bin]]` (the live HTTP/SSE
# server). Depends on the engine lib + the axum server framework.
[[bin]]
name = "gnosis-server"
path = "src/bin/gnosis_server.rs"

[lib]
name = "gnosis"
path = "src/lib.rs"
